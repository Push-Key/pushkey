[pytest]
# Use repo-local temp directory instead of system temp
# This avoids path length issues on Windows and keeps test artifacts local
tmp_path_retention_policy = failed
# Windows-compatible: create .pytest_tmp in repo root.
# tests/conftest.py narrows this to a per-session subdirectory. pytest deletes
# the whole --basetemp tree at session start, so a shared basetemp lets a second
# pytest run wipe the live tmp_path directories of a run already in progress.
addopts = --basetemp=.pytest_tmp
# Ensure project root is on sys.path so pushkey_* modules are importable
pythonpath = .
