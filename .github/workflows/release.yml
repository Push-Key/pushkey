name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
            requirements-dev.txt

      - name: Install tooling
        run: python -m pip install --upgrade pip build cyclonedx-bom

      - name: Run release tests
        run: python -m pytest -q

      - name: Build Python artifacts
        run: python -m build

      - name: Generate SBOM
        run: cyclonedx-py requirements requirements.txt requirements-api.txt requirements-dev.txt -o dist/python-sbom.json

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
