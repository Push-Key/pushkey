name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
            requirements-dev.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-api.txt -r requirements-dev.txt

      - name: Compile Python modules
        shell: pwsh
        run: |
          $modules = Get-ChildItem -Path . -Filter "pushkey*.py" | ForEach-Object { $_.FullName }
          python -m compileall $modules

      - name: Run tests
        run: python -m pytest -q

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  local-web-app:
    name: Local web app build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  package-smoke:
    name: Package smoke
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
            requirements-dev.txt

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build wheel and source distribution
        run: python -m build

      - name: Install wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl
          pushkey --help
          python scripts/package_upgrade_smoke.py --wheel "$(ls dist/*.whl)"

      - name: Install source distribution and test uninstall
        shell: bash
        run: |
          python -m pip uninstall -y pushkey
          python -m pip install dist/*.tar.gz
          pushkey --help
          python -m pip uninstall -y pushkey

  security:
    name: Security scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Export public repository boundary
        run: python scripts/public_export.py public-export

      - name: Secret scan public export
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source public-export --no-git --redact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
            requirements-dev.txt

      - name: Python dependency and static analysis
        run: |
          python -m pip install --upgrade pip pip-audit bandit cyclonedx-bom
          pip-audit -r requirements.txt -r requirements-api.txt -r requirements-dev.txt
          bandit -q -r pushkey*.py
          cyclonedx-py requirements requirements.txt requirements-api.txt requirements-dev.txt -o python-sbom.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: npm audit
        run: |
          npm --prefix web ci
          npm --prefix web audit --audit-level=high
          npm --prefix web-app ci
          npm --prefix web-app audit --audit-level=high

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
