name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
            requirements-dev.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-api.txt -r requirements-dev.txt

      - name: Compile Python modules
        shell: pwsh
        run: |
          $modules = Get-ChildItem -Path . -Filter "pushkey*.py" | ForEach-Object { $_.FullName }
          python -m compileall $modules

      - name: Run tests
        run: python -m pytest -q

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  local-web-app:
    name: Local web app build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Enforces the WCAG 2.2 AA conformance recorded in
      # docs/accessibility-conformance.md. Without this the axe scans and the
      # accessible-name assertions only ever run on a developer machine, so an
      # accessibility regression could reach the protected branch.
      - name: Accessibility and WCAG 2.2 AA scans
        run: npm run test:e2e -- accessibility.spec.ts wcag.spec.ts --project=chromium

      - name: Upload accessibility failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-app-accessibility-traces
          path: web-app/test-results
          if-no-files-found: ignore

  package-smoke:
    name: Package smoke
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
            requirements-dev.txt

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build wheel and source distribution
        run: python -m build

      - name: Install wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl
          pushkey --help
          python scripts/package_upgrade_smoke.py --wheel "$(ls dist/*.whl)"

      - name: Install source distribution and test uninstall
        shell: bash
        run: |
          python -m pip uninstall -y pushkey
          python -m pip install dist/*.tar.gz
          pushkey --help
          python -m pip uninstall -y pushkey

      - name: Smoke npm wrapper install, upgrade, and uninstall
        run: python scripts/npm_package_smoke.py

  security:
    name: Security scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # public_export.py refuses to write inside the source checkout so a
      # recursive copy cannot swallow its own output; tests/test_public_export.py
      # asserts that. This step used to pass a relative `public-export`, which
      # resolves inside the checkout, so it failed before scanning anything.
      - name: Export public repository boundary
        run: python scripts/public_export.py "$RUNNER_TEMP/public-export"

      # Deliberately the gitleaks CLI, not a second use of gitleaks-action. The
      # action ignores `args` and always scans the repository's git history, so
      # it never looked at the export; and it always uploads a fixed-name
      # results artifact, so a second use in the same run died with
      # "409 Conflict: an artifact with this name already exists".
      - name: Secret scan public export
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect \
            --source "$RUNNER_TEMP/public-export" \
            --config .gitleaks.toml \
            --no-git \
            --redact \
            --exit-code 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
            requirements-dev.txt

      - name: Python dependency and static analysis
        run: |
          python -m pip install --upgrade pip pip-audit bandit cyclonedx-bom
          pip-audit -r requirements.txt -r requirements-api.txt -r requirements-dev.txt
          # -ll gates on medium and high severity. Bare `bandit -r` fails on any
          # finding at all, which here meant 83 low-severity ones -- almost all
          # try/except/pass around best-effort cleanup, and subprocess calls
          # that pass argument lists rather than strings. A gate that can never
          # go green gets ignored or removed; this one blocks the severities
          # that actually warrant blocking a merge.
          bandit -q -r pushkey*.py -ll
          # cyclonedx-py takes exactly one requirements file, so concatenate
          # all three requirement sets into the SBOM input.
          cat requirements.txt requirements-api.txt requirements-dev.txt > sbom-requirements.txt
          cyclonedx-py requirements sbom-requirements.txt -o python-sbom.json

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: npm audit
        # --omit=dev scopes the high-severity gate to dependencies that ship to
        # users. The dev toolchain (eslint plugins, the shadcn CLI's bundled MCP
        # server) pulls deep transitive advisories that never reach the
        # production bundle; blocking every merge on them turns the gate into
        # noise. Dev-tool CVEs are tracked via Dependabot instead.
        run: |
          npm --prefix web ci
          npm --prefix web audit --omit=dev --audit-level=high
          npm --prefix web-app ci
          npm --prefix web-app audit --omit=dev --audit-level=high

      - name: Trivy filesystem scan
        # v0.36.0. The previous pin resolved an internal
        # aquasecurity/setup-trivy@v0.2.1 reference, and that tag no longer
        # exists upstream (the oldest published tag is now v0.2.6), so the job
        # failed during "Set up job" before running a single step.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
