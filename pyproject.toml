[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pushkey"
version = "2.1.0"
description = "Encrypted Key Manager with Direct .env Injection"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "pushkeydev", email = "pushkeydev@gmail.com"}]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=41.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "graphifyy @ git+https://github.com/safishamsi/graphify.git#egg=graphifyy",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
pushkey = "pushkey_cli:main"
pushkey-gui = "pushkey:main"

[tool.setuptools]
py-modules = ["pushkey", "pushkey_cli", "pushkey_local_api", "pushkey_mcp", "pushkey_agent_tokens", "pushkey_providers", "pushkey_shared", "pushkey_crypto", "pushkey_vault", "pushkey_tiers", "pushkey_icons"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["pushkey_web"]
namespaces = false

[tool.setuptools.package-data]
pushkey_web = ["out/**/*"]

[tool.pytest.ini_options]
tmp_path_retention_policy = "failed"
addopts = "--basetemp=.pytest_tmp"
