[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pushkey"
version = "2.1.0"
description = "Encrypted Key Manager with Direct .env Injection"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "pushkeydev", email = "pushkeydev@gmail.com"}]
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=21.3.0",
    "cryptography>=41.0.0",
    "customtkinter>=5.2.0",
    "fido2>=1.1.2",
    "pillow>=10.0.0",
    "pyotp>=2.9",
    "PyNaCl>=1.5.0",
    "qrcode[pil]>=8.0",
]

[project.optional-dependencies]
api = [
    "bcrypt>=4.0,<5",
    "fastapi>=0.115.0",
    "passlib[argon2]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "uvicorn[standard]>=0.32.0",
]
mcp = [
    "mcp[cli]>=1.0.0",
]
cloud = [
    "boto3>=1.26.0",
]
dev = [
    "build>=1.2.0",
    "pyinstaller>=6.0",
    "pytest>=7.0,<9",
]

[project.scripts]
pushkey = "pushkey_cli:main"
pushkey-gui = "pushkey:main"

[tool.setuptools]
py-modules = ["pushkey", "pushkey_cli", "pushkey_local_api", "pushkey_mcp", "pushkey_agent_tokens", "pushkey_providers", "pushkey_shared", "pushkey_crypto", "pushkey_vault", "pushkey_tiers", "pushkey_icons"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["pushkey_web"]
namespaces = false

[tool.setuptools.package-data]
pushkey_web = ["out/**/*"]

[tool.pytest.ini_options]
tmp_path_retention_policy = "failed"
addopts = "--basetemp=.pytest_tmp"
